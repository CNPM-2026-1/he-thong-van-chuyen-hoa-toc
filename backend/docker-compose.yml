# Tương đương lệnh docker run trong README. Chạy: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: hoatoc-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hoatoc
    ports:
      - "5432:5432"
    volumes:
      - hoatoc-pgdata:/var/lib/postgresql/data
volumes:
  hoatoc-pgdata:
