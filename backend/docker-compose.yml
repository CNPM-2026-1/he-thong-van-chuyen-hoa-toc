# Local development: PostgreSQL + MinIO (S3-compatible object storage).
# Start with: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: hoatoc-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hoatoc
    ports:
      - "5432:5432"
    volumes:
      - hoatoc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hoatoc"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: hoatoc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hoatoc-minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: hoatoc-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/hoatoc-media
      "
    restart: on-failure

volumes:
  hoatoc-pgdata:
  hoatoc-minio-data:
