        '422':
          description: Không thể xử lý dữ liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: VALIDATION_ERROR
                message: Không thể xử lý dữ liệu
      x-roles: &id002
      - CUSTOMER
      - STAFF
      - DRIVER
      - MANAGER
      - ADMIN
      security:
      - bearerAuth: []
      requestBody:
        required: true
