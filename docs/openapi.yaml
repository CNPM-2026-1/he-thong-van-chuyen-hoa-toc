                $ref: '#/components/schemas/ApiError'
              example:
                code: REQUEST_ERROR
                message: Xung đột trạng thái/nghiệp vụ
        '422':
          description: Không thể xử lý dữ liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: VALIDATION_ERROR
                message: Không thể xử lý dữ liệu
      x-roles:
      - PUBLIC
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example: &id025
              identifier: customer@example.com
              password: Password123!
  /auth/refresh:
    post:
      operationId: refreshTokens
      tags:
      - Auth
      summary: Làm mới access/refresh token
      description: Xác thực refresh token, thu hồi token cũ và cấp cặp token mới.
