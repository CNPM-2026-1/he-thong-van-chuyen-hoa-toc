                refreshToken: <new-refresh-token>
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: VALIDATION_ERROR
                message: Dữ liệu không hợp lệ
        '401':
          description: Thiếu hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: REQUEST_ERROR
                message: Thiếu hoặc token không hợp lệ
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: REQUEST_ERROR
                message: Không có quyền
        '404':
          description: Không tìm thấy resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: REQUEST_ERROR
                message: Không tìm thấy resource
        '409':
          description: Xung đột trạng thái/nghiệp vụ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: REQUEST_ERROR
                message: Xung đột trạng thái/nghiệp vụ
        '422':
          description: Không thể xử lý dữ liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: VALIDATION_ERROR
                message: Không thể xử lý dữ liệu
      x-roles:
      - PUBLIC
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example: &id027
