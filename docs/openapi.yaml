openapi: 3.1.0
info:
  title: Express Inter-Provincial Delivery Management API
  version: 1.0.0
  description: 'Hợp đồng REST API đề xuất cho hệ thống quản lý quy trình vận chuyển hàng hóa hỏa tốc liên tỉnh.
    Quy ước Sprint 1: /api/v1, JSON, role CUSTOMER/STAFF/DRIVER/MANAGER/ADMIN; list {items,page,total}; errors {code,message}.
    Những endpoint nghiệp vụ Sprint 2+ cần nhóm xác nhận trước khi triển khai.'
servers:
- url: http://localhost:3000/api/v1
  description: Backend local (NestJS)
- url: https://api.example.com/api/v1
  description: Server/staging placeholder - thay bằng domain của nhóm
tags:
- name: Auth
  description: Đăng ký, đăng nhập và phiên làm việc
- name: Users
  description: Tài khoản và phân quyền
- name: Stations
  description: Bến, văn phòng và kho
- name: Routes
  description: Tuyến vận chuyển
- name: Vehicles
  description: Phương tiện
- name: Drivers
  description: Tài xế
- name: Price Rules
  description: Bảng giá theo tuyến
- name: Pricing
  description: Tính cước
- name: Orders
  description: Đơn hàng và tiếp nhận
- name: Trips
  description: Chuyến xe
- name: Manifest
  description: Danh sách kiện/đơn theo chuyến
- name: Tracking
  description: Theo dõi vị trí và hành trình
- name: Delivery
  description: OTP và xác nhận giao hàng
- name: COD
  description: Thu hộ và đối soát COD
- name: Incidents
  description: Sự cố vận hành
- name: Statistics
  description: Thống kê
- name: Media
  description: Upload ảnh/chứng từ
paths:
  /auth/register:
    post:
      operationId: registerCustomer
      tags:
      - Auth
      summary: Đăng ký tài khoản khách hàng
      description: Tạo tài khoản CUSTOMER. Password được hash bằng bcrypt ở backend.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example: &id001
                id: 11111111-1111-4111-8111-111111111111
                fullName: Nguyen Van A
                email: customer@example.com
                phone: 0900000001
                role: CUSTOMER
                status: ACTIVE
                createdAt: '2026-11-11T08:00:00Z'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: VALIDATION_ERROR
                message: Dữ liệu không hợp lệ
        '401':
          description: Thiếu hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: REQUEST_ERROR
                message: Thiếu hoặc token không hợp lệ
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: REQUEST_ERROR
                message: Không có quyền
        '404':
          description: Không tìm thấy resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: REQUEST_ERROR
                message: Không tìm thấy resource
        '409':
          description: Xung đột trạng thái/nghiệp vụ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: REQUEST_ERROR
                message: Xung đột trạng thái/nghiệp vụ
        '422':
          description: Không thể xử lý dữ liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: VALIDATION_ERROR
                message: Không thể xử lý dữ liệu
      x-roles:
      - PUBLIC
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example: &id026
              fullName: Nguyen Van A
              email: customer@example.com
              phone: 0900000001
              password: Password123!
  /auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: Đăng nhập
      description: Trả về đúng ba trường accessToken, refreshToken, user như kế hoạch Sprint 1.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: <access-token>
                refreshToken: <refresh-token>
                user: *id001
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: VALIDATION_ERROR
                message: Dữ liệu không hợp lệ
        '401':
          description: Thiếu hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: REQUEST_ERROR
                message: Thiếu hoặc token không hợp lệ
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: REQUEST_ERROR
                message: Không có quyền
        '404':
          description: Không tìm thấy resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: REQUEST_ERROR
                message: Không tìm thấy resource
        '409':
