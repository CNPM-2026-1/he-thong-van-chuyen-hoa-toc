              example:
                code: REQUEST_ERROR
                message: Không tìm thấy resource
        '409':
          description: Xung đột trạng thái/nghiệp vụ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: REQUEST_ERROR
                message: Xung đột trạng thái/nghiệp vụ
        '422':
          description: Không thể xử lý dữ liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: VALIDATION_ERROR
                message: Không thể xử lý dữ liệu
      x-roles:
      - MANAGER
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Trang bắt đầu từ 1.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          default: 20
          minimum: 1
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Từ khóa tìm kiếm tùy resource.
    post:
      operationId: createUser
      tags:
      - Users
      summary: Tạo tài khoản nhân viên/tài xế
      description: ''
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
