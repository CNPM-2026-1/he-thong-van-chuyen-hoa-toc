  /users:
    get:
      operationId: listUsers
      tags:
      - Users
      summary: Danh sách tài khoản
      description: Hỗ trợ tìm kiếm và phân trang. Có thể lọc thêm role/status ở bản triển khai.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  page:
                    type: integer
                    minimum: 1
                  total:
                    type: integer
                    minimum: 0
                required:
                - items
                - page
                - total
                example:
                  items:
                  - *id001
                  page: 1
                  total: 1
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
